<div class="registros-page">

    <section class="card card-form" id="cardFormAhorro">
        <div class="card-form__header">
            <h2 id="formTituloAhorro">Nuevo ahorro</h2>
            <button type="button" class="link-btn d-none" id="btnCancelarEdicionAhorro">Cancelar edición</button>
        </div>

        <form id="formAhorro" autocomplete="off">
            <input type="hidden" id="pk_ahorro">

            <div class="field">
                <label for="nombre_ahorro">¿Para qué es este ahorro?</label>
                <input type="text" id="nombre_ahorro" placeholder="Ej. Vacaciones, Fondo de emergencia..." required autofocus>
            </div>

            <div class="field">
                <label for="monto">Monto</label>
                <div class="input-money">
                    <span>$</span>
                    <input type="number" id="monto" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
                </div>
            </div>

            <div class="field">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" placeholder="Notas opcionales">
            </div>

            <button type="submit" class="btn-primary btn-block" id="btnGuardarAhorro">Guardar ahorro</button>
        </form>
    </section>

    <section>
        <div class="feed__header">
            <h2>Ahorros registrados</h2>
            <span class="feed__total" id="feedTotalAhorro"></span>
        </div>

        <div id="listaAhorro" class="feed__list"></div>
        <p class="feed__empty d-none" id="ahorroVacio">Aún no registras ahorros.</p>
    </section>

</div>
